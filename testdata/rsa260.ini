; The chosen multiplicative generator that defines the period finding problem:
; [f(x) = pow(generator, x, modulus)]
generator = 5

; === Performance parameters ===
; The Ekerå-Håstad parameter used for dividing the problem into multiple shots.
s = 6
; Window size for lookups in loop1 (computes log of the residue by summing values looked up from groups of exponent qubits).
window1 = 5
; Window sizes for lookups in loop3 (computes a small modular exponentation to get the actual residue from its log).
window3a = 2
window3b = 3
; Window sizes used during loop3 (adds residue's contribution into an accumulator).
window4 = 5

; === Approximation parameters ===
; Determines how many bits the accumulator is truncated down to.
; Each addition into the accumulator will incur an approximation error
len_accumulator = 32
; Determines how small N % L must be, where N is the number to factor and L is the modulus of the residue system.
; Specifically, it requires that min(N % L, -N % L) < N / 2**min_wraparound_gap
; (This bounds an approximation error that accumulates due to working the accumulator modulo N rather than modulo L.)
min_wraparound_gap = 32
mask_bits = 16
